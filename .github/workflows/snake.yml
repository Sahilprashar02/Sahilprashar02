name: Generate Contribution Snake & Activity Graph

on:
  schedule:
    - cron: "0 0 * * *" # Regenerate daily at midnight UTC.
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Build contribution snake & activity graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: contribution-assets
      cancel-in-progress: false
    steps:
      - name: Generate snake from GitHub contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Sahilprashar02
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution activity graph
        uses: ashutosh00710/github-readme-activity-graph@v1.2.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output: dist/activity-graph.svg
          theme: tokyonight
          area: true
          hide_border: true

      - name: Publish generated assets
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: github-snake
          force_orphan: true
